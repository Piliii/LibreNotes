name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  # ── Guard: tag must match pubspec ───────────────────────────────────────────
  # A tag that disagrees with clients/app/pubspec.yaml would publish
  # mislabeled artifacts and make F-Droid build the wrong versionName.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PUBSPEC=$(sed -n -E 's/^version: ([0-9.]+)\+[0-9]+$/\1/p' clients/app/pubspec.yaml)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC" != "$TAG" ]; then
            echo "::error::Tag v$TAG doesn't match clients/app/pubspec.yaml version $PUBSPEC"
            exit 1
          fi

  # ── Android APK ─────────────────────────────────────────────────────────────
  build-android:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'

      # Real release signing key, decoded from a secret rather than checked
      # into git. Skipped (falls back to debug signing) if the secret isn't
      # configured, e.g. on a fork. See CLAUDE.md "Licensing & distribution."
      # The `secrets` context can't be used in a step `if:` (GitHub Actions
      # rejects the whole workflow file at parse time if you try), so the
      # emptiness check happens in the shell instead.
      - name: Set up release signing
        working-directory: clients/app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No release keystore secret configured; falling back to debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Build APK
        working-directory: clients/app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Stage artifact
        run: |
          VERSION=$(grep '^version:' clients/app/pubspec.yaml | sed 's/version: //;s/+.*//')
          cp clients/app/build/app/outputs/flutter-apk/app-release.apk \
             "LibreNotes-${VERSION}-android-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: LibreNotes-*-android-arm64.apk

  # ── Linux client (AppImage + tarball + .deb + .rpm) ─────────────────────────
  build-linux-client:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev \
            libkeybinder-3.0-dev \
            pkg-config ninja-build cmake clang

      # fpm builds the .deb and .rpm (scripts/package-linux-deb-rpm.sh); rpm
      # provides rpmbuild for the .rpm.
      - name: Install packaging tools (fpm, rpm)
        run: |
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install fpm --no-document -v 1.18.0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Linux artifacts
        env:
          # A missing fpm/rpmbuild must fail the release, not quietly ship
          # without the .deb/.rpm.
          REQUIRE_PACKAGES: '1'
        run: bash scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: |
            dist/LibreNotes-*.tar.gz
            dist/LibreNotes-*.AppImage
            dist/LibreNotes-*.deb
            dist/LibreNotes-*.rpm

  # ── Server tarball ───────────────────────────────────────────────────────────
  build-server:
    needs: check-version
    strategy:
      matrix:
        include:
          # `arch` matches the tarball-naming convention used by
          # package-server.sh (see CLAUDE.md item 24). `dart_arch` is the
          # separate, unrelated value dart-lang/setup-dart's `architecture`
          # input actually accepts ('x64'/'ia32'/'arm'/'arm64' — NOT
          # 'x86_64', which 404s against the Dart SDK archive).
          - runner: ubuntu-latest
            arch: x86_64
            dart_arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            dart_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          architecture: ${{ matrix.dart_arch }}

      - name: Install libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build server tarball
        run: bash scripts/package-server.sh

      - uses: actions/upload-artifact@v4
        with:
          name: server-tarball-${{ matrix.arch }}
          path: dist/librenotes-server-*.tar.gz

  # ── GitHub release ───────────────────────────────────────────────────────────
  publish-release:
    needs: [build-android, build-linux-client, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true

  # ── AUR (librenotes-bin) ─────────────────────────────────────────────────────
  # Runs in an Arch Linux container so makepkg is available.
  # Requires AUR_SSH_KEY secret: the private key whose public half is registered
  # on the AUR account that owns the librenotes-bin package.
  update-aur:
    needs: publish-release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm git openssh curl base-devel

      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Update PKGBUILD and push to AUR
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa
        run: |
          VERSION=$(grep '^version:' clients/app/pubspec.yaml | sed 's/version: //;s/+.*//')
          TARBALL_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/LibreNotes-${VERSION}-linux-x86_64.tar.gz"
          SHA256=$(curl -fsSL "$TARBALL_URL" | sha256sum | cut -d' ' -f1)

          git clone ssh://aur@aur.archlinux.org/librenotes-bin.git /tmp/aur

          # Update version and checksum in the PKGBUILD template from this repo
          sed \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA256}')/" \
            aur/PKGBUILD > /tmp/aur/PKGBUILD

          # makepkg refuses to run as root — run it in a separate dir so
          # /tmp/aur stays root-owned and git operations succeed.
          useradd -m builder
          mkdir -p /tmp/makepkg-build
          cp /tmp/aur/PKGBUILD /tmp/makepkg-build/
          chown -R builder:builder /tmp/makepkg-build
          runuser -u builder -- bash -c "cd /tmp/makepkg-build && makepkg --printsrcinfo > .SRCINFO"
          cp /tmp/makepkg-build/.SRCINFO /tmp/aur/.SRCINFO

          git -C /tmp/aur config user.name "Piliii"
          git -C /tmp/aur config user.email "developer@ayopili.com"
          git -C /tmp/aur add PKGBUILD .SRCINFO
          git -C /tmp/aur commit -m "Update to v${VERSION}"
          git -C /tmp/aur push
