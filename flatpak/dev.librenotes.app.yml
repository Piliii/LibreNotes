id: dev.librenotes.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: librenotes

finish-args:
  # Sync with self-hosted server over LAN / VPN
  - --share=network
  # X11 shared memory
  - --share=ipc
  # Display: prefer Wayland, fall back to X11
  - --socket=wayland
  - --socket=fallback-x11
  # GPU acceleration for Flutter rendering
  - --device=dri

modules:
  - name: librenotes
    buildsystem: simple

    sources:
      - type: archive
        url: https://github.com/Piliii/LibreNotes/releases/download/v1.0.1/LibreNotes-1.0.1-linux-x86_64.tar.gz
        sha256: 6818e31bfb745f59c69e6759f1a805a62110186b2025a9eb1833f4aabdede399
        only-arches:
          - x86_64

      # Launcher wrapper script
      - type: file
        path: librenotes-wrapper.sh

      # AppStream metadata (Flathub requirement)
      - type: file
        path: dev.librenotes.app.appdata.xml

    build-commands:
      # Install the Flutter bundle under /app/opt so its relative lib/ and data/
      # paths are preserved (binary uses $ORIGIN/lib RPATH).
      - install -dm755 /app/opt/librenotes
      - cp -r librenotes/. /app/opt/librenotes/

      # Launcher wrapper at /app/bin so Flatpak can find the command.
      - install -Dm755 librenotes-wrapper.sh /app/bin/librenotes

      # Desktop entry, icon, AppStream metadata
      - install -Dm644 librenotes/dev.librenotes.app.desktop /app/share/applications/dev.librenotes.app.desktop
      - install -Dm644 librenotes/dev.librenotes.app.png /app/share/icons/hicolor/512x512/apps/dev.librenotes.app.png
      - install -Dm644 dev.librenotes.app.appdata.xml /app/share/metainfo/dev.librenotes.app.appdata.xml
